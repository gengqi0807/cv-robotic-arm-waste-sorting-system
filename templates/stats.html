<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f6f3">
  <title>运营统计 | 智能分拣管理</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
  <script src="{{ url_for('static', filename='js/stats.js') }}" defer></script>
</head>
<body data-page="stats">
  <div class="app-shell">
    <aside class="rail">
      <a class="brand-mark" href="{{ url_for('records_page') }}" aria-label="智能分拣管理首页">分</a>
      <div class="rail-label">管理台</div>
      <nav class="rail-nav" aria-label="主导航">
        <a class="nav-link" href="{{ url_for('records_page') }}">
          <span class="nav-icon" aria-hidden="true">▤</span><span>记录查询</span>
        </a>
        <a class="nav-link active" href="{{ url_for('stats_page') }}" aria-current="page">
          <span class="nav-icon" aria-hidden="true">▥</span><span>运营统计</span>
        </a>
        <a class="nav-link" href="{{ url_for('tasks_page') }}">
          <span class="nav-icon" aria-hidden="true">▷</span><span>任务操作</span>
        </a>
        <a class="nav-link" href="{{ url_for('monitor_page') }}">
          <span class="nav-icon" aria-hidden="true">◎</span><span>实时监控</span>
        </a>
      </nav>
      <div class="rail-foot"><span class="status-dot"></span>系统记录</div>
    </aside>

    <main class="main-content">
      <header class="page-header">
        <div>
          <p class="eyebrow">分拣管理 / 运营概览</p>
          <h1>运营统计</h1>
        </div>
        <a class="text-link" href="{{ url_for('records_page') }}">查看分拣明细 <span aria-hidden="true">→</span></a>
      </header>

      <section class="stats-filter" aria-label="统计范围">
        <fieldset class="segmented-control">
          <legend class="visually-hidden">统计范围类型</legend>
          <label><input type="radio" name="range-mode" value="date" checked><span>按日期</span></label>
          <label><input type="radio" name="range-mode" value="shift"><span>按班次时段</span></label>
        </fieldset>
        <label class="filter-field" id="date-field">
          <span>统计日期</span>
          <input id="stats-date" type="date">
        </label>
        <div class="range-fields" id="shift-fields" hidden>
          <label class="filter-field"><span>开始时间</span><input id="shift-start" type="datetime-local"></label>
          <span class="range-separator" aria-hidden="true">至</span>
          <label class="filter-field"><span>结束时间</span><input id="shift-end" type="datetime-local"></label>
        </div>
        <button class="button button-primary" id="load-stats" type="button"><span aria-hidden="true">↻</span> 更新统计</button>
      </section>

      <p class="range-caption" id="range-caption" aria-live="polite">统计时间按本地时间选择</p>

      <section class="summary-grid" aria-label="分拣概况">
        <article class="summary-panel summary-total">
          <span class="summary-label">分拣总数</span>
          <strong class="summary-value" id="total-count">—</strong>
          <span class="summary-foot">当前统计范围</span>
        </article>
        <article class="summary-panel summary-success">
          <span class="summary-label">成功</span>
          <strong class="summary-value" id="success-count">—</strong>
          <span class="summary-foot">result = success</span>
        </article>
        <article class="summary-panel summary-failure">
          <span class="summary-label">失败</span>
          <strong class="summary-value" id="failure-count">—</strong>
          <span class="summary-foot">非 success 结果</span>
        </article>
        <article class="summary-panel summary-fault">
          <span class="summary-label">故障</span>
          <strong class="summary-value" id="fault-count">—</strong>
          <span class="summary-foot">含非空错误码的记录</span>
        </article>
      </section>

      <section class="category-section" aria-labelledby="category-title">
        <div class="section-heading">
          <div><h2 id="category-title">类别分布</h2><p class="muted">数量及占当前分拣总数的比例</p></div>
        </div>
        <div class="category-table-wrap">
          <table class="category-table">
            <thead><tr><th scope="col">垃圾类别</th><th scope="col">数量</th><th scope="col">占比</th><th scope="col">分布</th></tr></thead>
            <tbody id="category-body">
              <tr><td class="table-message" colspan="4">正在读取统计…</td></tr>
            </tbody>
          </table>
        </div>
        <p id="stats-error" class="error-message" role="alert" hidden></p>
      </section>
    </main>
  </div>
</body>
</html>
