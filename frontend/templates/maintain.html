<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>设备维护 | 智能分拣管理</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
  <style>
    body { background: #f4f6f3; }
    .maintain-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
    .card { border: 1px solid #dde7e0; background: white; box-shadow: 0 12px 26px rgba(18,40,30,0.05); }
    .card-header { padding: 18px 18px 0; }
    .card-body { padding: 18px; }
    .status-pills { display: flex; flex-wrap: wrap; gap: 10px; }
    .status-pill { display: inline-flex; min-height: 28px; align-items: center; padding: 4px 10px; background: #eef6f1; color: #1a6956; font-weight: 700; font-size: 11px; }
    .muted-text { color: #6a7d74; font-size: 12px; }
    .detail-list { display: grid; gap: 10px; margin: 0; color: #324a40; font-size: 12px; }
    .detail-list li { list-style: none; padding: 10px 12px; background: #f8faf8; border: 1px solid #edf1ee; }
  </style>
</head>
<body data-page="maintain">
  <div class="app-shell">
    {% set sidebar_label = "设备维护" %}
    {% include "_sidebar.html" %}

    <main class="main-content">
      <header class="page-header">
        <div>
          <p class="eyebrow">设备管理 / 维护</p>
          <h1>设备维护</h1>
        </div>
      </header>

      <div class="maintain-grid">
        <section class="card">
          <div class="card-header"><h2>设备状态</h2></div>
          <div class="card-body">
            <div class="status-pills"><span class="status-pill">{{ '在线' if device.device_online else '离线' }}</span></div>
            <p class="muted-text" style="margin-top: 18px;">{{ device.message }}</p>
            <a class="text-link" href="{{ url_for('monitor_page') }}">查看实时监控</a>
          </div>
        </section>

        <section class="card">
          <div class="card-header"><h2>校准位置</h2></div>
          <div class="card-body">
            <ul class="detail-list">
              <li>等待设备提供标定版本与实测数据。</li>
            </ul>
          </div>
        </section>

        <section class="card">
          <div class="card-header"><h2>故障处理</h2></div>
          <div class="card-body">
            <ul class="detail-list">
              <li>{{ device.message if device.robot_state in ('fault', 'estop') else '暂无设备故障上报。' }}</li>
            </ul>
          </div>
        </section>
      </div>
    </main>
  </div>

</body>
</html>
