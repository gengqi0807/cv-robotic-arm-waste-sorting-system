<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 | 智能分拣管理</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #edf5f1, #f7f9f7);
      font-family: "Microsoft YaHei UI", "PingFang SC", sans-serif;
    }
    .login-shell {
      width: min(960px, calc(100vw - 32px));
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      min-height: 620px;
      border: 1px solid #dfe9e2;
      background: white;
      box-shadow: 0 24px 60px rgba(15, 39, 31, 0.12);
    }
    .login-hero {
      position: relative;
      overflow: hidden;
      padding: 42px 40px;
      background: linear-gradient(160deg, #173d34 0%, #214e45 44%, #2c6b5b 100%);
      color: white;
    }
    .login-hero::before {
      content: "";
      position: absolute;
      inset: 18% -20% auto auto;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
    }
    .login-hero-inner {
      position: relative;
      z-index: 1;
    }
    .brand-mark {
      display: grid;
      width: 52px;
      height: 52px;
      place-items: center;
      border: 1px solid rgba(255,255,255,0.24);
      background: rgba(255,255,255,0.08);
      font-weight: 800;
      letter-spacing: 1px;
    }
    .login-hero h1 {
      margin: 28px 0 12px;
      font-size: clamp(28px, 4vw, 42px);
      line-height: 1.2;
    }
    .login-hero p {
      margin: 0;
      color: rgba(255,255,255,0.78);
      line-height: 1.7;
      font-size: 15px;
    }
    .login-card {
      padding: 42px 34px 30px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .login-card h2 {
      margin: 0 0 14px;
      font-size: 30px;
      color: #183a30;
    }
    .subtext {
      margin: 0 0 28px;
      color: #6d7a74;
      font-size: 13px;
    }
    .auth-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 22px;
    }
    .auth-tab {
      flex: 1;
      min-height: 38px;
      border: 1px solid #dfe9e2;
      background: #f7faf8;
      color: #486157;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .auth-tab.active {
      background: #183d34;
      color: white;
      border-color: #183d34;
    }
    .auth-panel {
      display: none;
      gap: 18px;
    }
    .auth-panel.active {
      display: grid;
    }
    .field {
      display: grid;
      gap: 8px;
      font-size: 12px;
      color: #495e56;
      font-weight: 700;
    }
    .field input {
      min-height: 42px;
      padding: 0 12px;
      border: 1px solid #ccd9d2;
      background: white;
      color: #1b2d27;
      font-size: 13px;
    }
    .field input:focus {
      outline: 2px solid rgba(23, 107, 85, 0.12);
      border-color: #1b6d58;
    }
    .action-btn {
      min-height: 44px;
      border: 0;
      background: #176b55;
      color: white;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .action-btn:hover {
      background: #11543f;
    }
    .secondary-btn {
      border: 1px solid #d5e3dc;
      background: white;
      color: #1b4e42;
      font-weight: 700;
    }
    .notice {
      min-height: 48px;
      padding: 12px 14px;
      border-left: 3px solid #d97d3d;
      background: #fff6ef;
      color: #7a4f2b;
      font-size: 12px;
      line-height: 1.5;
    }
    .notice.error {
      color: #8c3d35;
      background: #fff1f0;
      border-left-color: #b6524b;
    }
    .notice.success {
      color: #1d5b48;
      background: #ebf8f0;
      border-left-color: #1b7d5f;
    }
    .hint {
      font-size: 11px;
      color: #6d7a74;
      line-height: 1.6;
    }
    #face-form { display: grid; gap: 10px; margin-bottom: 20px; }
    .camera-preview { display: block; width: 100%; max-height: 260px; aspect-ratio: 4 / 3; object-fit: contain; background: #172f28; transform: scaleX(-1); }
    .camera-buttons { display: flex; flex-wrap: wrap; gap: 8px; }
    .camera-buttons button, #face-upload { min-height: 38px; padding-inline: 13px; cursor: pointer; }
    #face-form button:disabled { cursor: not-allowed; opacity: .55; }
    .camera-status { margin: 0; font-size: 12px; color: #495e56; }
    .upload-options { font-size: 12px; color: #1b4e42; }
    .upload-options summary { cursor: pointer; }
    .upload-options .field { margin-block: 10px; }
    @media (max-width: 768px) {
      .login-shell {
        grid-template-columns: 1fr;
      }
      .login-hero { min-height: 220px; }
    }
  </style>
</head>
<body data-page="login">
  <div class="login-shell">
    <section class="login-hero">
      <div class="login-hero-inner">
        <div class="brand-mark">分</div>
        <h1>智能分拣与机械臂管理平台</h1>
        <p>人脸认证、密码/工牌备用登录、角色化权限控制与设备状态统一入口。</p>
      </div>
    </section>

    <section class="login-card">
      <h2>登录</h2>
      {% if g.web_context.face_image_login_enabled %}
        <form id="face-form" enctype="multipart/form-data" data-camera-source="{{ g.web_context.face_camera_source or 'browser' }}">
          <video id="face-preview" class="camera-preview" aria-label="本机摄像头预览" autoplay muted playsinline hidden></video>
          <img id="robot-face-preview" class="camera-preview" alt="机械臂人脸观察位画面" hidden>
          <div class="camera-buttons">
            <button class="action-btn" id="camera-open" type="button">重新开启自动识别</button>
            <button class="secondary-btn" id="camera-close" type="button" hidden>关闭摄像头</button>
          </div>
          <p class="camera-status" id="camera-status" role="status">正在开启摄像头…</p>
          <div id="face-success" class="notice success" role="status" hidden></div>
          <details class="upload-options">
            <summary>从文件选择照片</summary>
            <div class="field">
              <label for="face-image">人脸图片</label>
              <input id="face-image" name="image" type="file" accept="image/*">
            </div>
            <button class="secondary-btn" id="face-upload" type="submit">上传识别</button>
          </details>
          <span class="hint">请正对镜头，摄像头开启后自动识别；成功后显示姓名与身份并进入系统。图片仅用于识别，不保存。当前未启用活体检测。</span>
        </form>
      {% endif %}
      <form id="password-form">
        <div class="field">
          <label for="operator-id">员工编号</label>
          <input id="operator-id" name="operator_id" type="text" autocomplete="username" maxlength="64" required>
        </div>
        <div class="field">
          <label for="password-input">密码</label>
          <input id="password-input" name="password" type="password" autocomplete="current-password">
        </div>
        <div class="field">
          <label for="badge-input">工牌号码（备用登录）</label>
          <input id="badge-input" name="badge_code" type="text" maxlength="64">
        </div>
        <button class="action-btn" type="submit">登录</button>
      </form>
      <div id="login-message" class="notice error" role="alert" hidden></div>
    </section>
  </div>
  <script src="{{ url_for('static', filename='js/login.js') }}" defer></script>
</body>
</html>
